name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_RC_IOS_KEY: ${{ secrets.EXPO_PUBLIC_RC_IOS_KEY }}
          EXPO_PUBLIC_RC_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_RC_ANDROID_KEY }}

      - name: Enable JS bundling for debug build
        working-directory: app
        run: |
          node -e "
            const fs = require('fs');
            const path = 'android/app/build.gradle';
            let content = fs.readFileSync(path, 'utf8');
            if (!content.includes('bundleInDebug')) {
              content = content.replace(/react\s*\{/, 'react {\n    bundleInDebug = true');
            }
            fs.writeFileSync(path, content);
          "

      - name: Build debug APK (standalone)
        working-directory: app/android
        run: ./gradlew assembleDebug
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_RC_IOS_KEY: ${{ secrets.EXPO_PUBLIC_RC_IOS_KEY }}
          EXPO_PUBLIC_RC_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_RC_ANDROID_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: selina-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk